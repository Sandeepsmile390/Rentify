name: rentify
description: Rentify — Production rent management platform for Android and Web.
publish_to: 'none'
version: 1.2.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Routing ───────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Backend ───────────────────────────────────────────────────
  supabase_flutter: ^2.5.0

  # ── Data / serialization ──────────────────────────────────────
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # ── UI helpers ────────────────────────────────────────────────
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # ── Utilities ─────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.0

  # ── Device / platform ────────────────────────────────────────
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  image: ^4.2.0
  file_picker: ^8.0.7

  # ── Logging ──────────────────────────────────────────────────
  logging: ^1.2.0

  cupertino_icons: ^1.0.8
  permission_handler: 11.3.1
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
